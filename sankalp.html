<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>Sankalp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Hanken+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one column, bottom tab bar, a single large streak ring as the focal point. */
:root{
  --bg:#EEF2F0; --surface:#F9FBFA; --ink:#14231F; --muted:#5B6E68; --line:#D3DDD9;
  --accent:#0F766E; --accent-ink:#FFFFFF; --warn:#B45309; --bad:#B42318; --ring:#CFE0DB;
  --f-d:'Bricolage Grotesque',system-ui,sans-serif; --f-b:'Hanken Grotesk',system-ui,sans-serif; --f-m:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1816; --surface:#14231F; --ink:#E5F0EC; --muted:#93A9A2; --line:#263A35;
  --accent:#4FD1BF; --accent-ink:#04201C; --warn:#F5B25B; --bad:#FF8A7A; --ring:#1F332E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1816; --surface:#14231F; --ink:#E5F0EC; --muted:#93A9A2; --line:#263A35;
  --accent:#4FD1BF; --accent-ink:#04201C; --warn:#F5B25B; --bad:#FF8A7A; --ring:#1F332E; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-b);
  padding-block:20px calc(88px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:520px;margin:0 auto}
h1,h2,h3{font-family:var(--f-d);margin:0;text-wrap:balance;line-height:1.15}
h2{font-size:1.35rem;margin-bottom:10px} h3{font-size:1.05rem;margin-bottom:6px}
p{margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.btn{font:700 .95rem var(--f-b);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 16px;border-radius:10px;cursor:pointer}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn.sos{background:var(--warn);color:var(--bg);border-color:var(--warn);width:100%;font-size:1.05rem;padding:14px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
textarea{min-height:90px;resize:vertical}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.top h1{font-size:1.5rem;font-weight:800}
.ringwrap{position:relative;width:min(280px,78vw);aspect-ratio:1;margin:6px auto 14px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.days{font:800 4.2rem/1 var(--f-d)} .clock{font:500 1.15rem var(--f-m);font-variant-numeric:tabular-nums;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:700 .8rem var(--f-b);padding:5px 11px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chip.done{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stat b{display:block;font:800 1.6rem var(--f-d)} .stat span{font-size:.8rem;color:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs{display:flex;width:100%;max-width:520px}
.tab{flex:1;background:none;border:0;color:var(--muted);font:700 .8rem var(--f-b);padding:10px 4px;border-radius:10px;cursor:pointer}
.tab[aria-current="page"]{color:var(--accent);background:var(--bg)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:700 1rem var(--f-b);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:300px;height:auto}
.chart .bar{fill:var(--accent)} .chart .bar.warn{fill:var(--warn)} .chart text{fill:var(--muted);font:500 9px var(--f-m)}
.chart line{stroke:var(--line)}
.breath{width:170px;height:170px;border-radius:50%;margin:18px auto;background:var(--ring);border:3px solid var(--accent);
  display:flex;align-items:center;justify-content:center;text-align:center;font:800 1.3rem var(--f-d);transition:transform 3.5s ease-in-out}
@media (prefers-reduced-motion:reduce){.breath{transition:none}}
.big{font:500 2.6rem var(--f-m);font-variant-numeric:tabular-nums;text-align:center}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.check input{width:20px;height:20px;margin-top:3px;flex:none}
.overlay{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.overlay>div{max-width:520px;margin:0 auto}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.scrim .card{max-width:420px;width:100%;margin:0}
ol{padding-left:20px;margin:0 0 10px} li{margin-bottom:6px}
code{font-family:var(--f-m);font-size:.85em;background:var(--bg);padding:2px 5px;border-radius:5px;overflow-wrap:anywhere}
</style>

<main>
  <div class="top"><h1>Sankalp</h1><span class="muted small" id="quote-day"></span></div>
  <div id="view"></div>
</main>
<nav><div class="tabs" role="tablist" id="tabs"></div></nav>
<div id="layer"></div>

<script>
(function(){
"use strict";
var KEY="sankalp.v1", MILE=[1,3,7,14,30,60,90,180,365];
var TRIG=["Akela / bore","Phone / social media","Raat ko","Stress","Content dikh gaya","Dost / sangat","Other"];
var QUOTES=["Aaj ka ek din jeet liya, kal ka kal dekhenge.","Urge ek lehar hai. 10 minute me utar jati hai.","Jo tum aaj chhodoge, wahi kal tumhari padhai ki taakat banega.","Girna fail hona nahi hai. Wapas utho, streak dobara shuru karo.","Discipline mood ka intezaar nahi karta.","Chhote kadam, roz. Yahi poora khel hai.","Tum apne aap se kiya vaada nibha rahe ho."];
var DNS=[["Cloudflare Family","1.1.1.3","1.0.0.3"],["CleanBrowsing Adult Filter","185.228.168.10","185.228.169.11"]];
var S=load();
function def(){return {start:null,best:0,relapses:[],checkins:{},focus:{},urges:0,reasons:""}}
function load(){try{var r=localStorage.getItem(KEY);if(r){return Object.assign(def(),JSON.parse(r))}}catch(e){}return def()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function $(id){return document.getElementById(id)}
function today(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function cur(){return S.start?Math.max(0,Date.now()-S.start):0}
var DAY=86400000;
function pad(n){return String(n).padStart(2,"0")}
function clock(ms){var s=Math.floor(ms/1000);return pad(Math.floor(s%86400/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60)}
function mmss(ms){var s=Math.max(0,Math.ceil(ms/1000));return pad(Math.floor(s/60))+":"+pad(s%60)}

var tab="home", timers=[];
var TABS=[["home","Streak"],["focus","Focus"],["block","Block"],["progress","Progress"],["more","Aur"]];
function drawTabs(){
  var t=$("tabs");t.innerHTML="";
  TABS.forEach(function(x){var b=document.createElement("button");b.className="tab";b.textContent=x[1];b.setAttribute("role","tab");
    if(x[0]===tab)b.setAttribute("aria-current","page");
    b.onclick=function(){tab=x[0];render()};t.appendChild(b)});
}
function clearTimers(){timers.forEach(clearInterval);timers=[]}
function render(){clearTimers();drawTabs();({home:home,focus:focus,block:blockView,progress:progress,more:more})[tab]();window.scrollTo(0,0)}

/* ---------- Streak ---------- */
function home(){
  var v=$("view");$("quote-day").textContent="";
  var q=QUOTES[Math.floor(Date.now()/DAY)%QUOTES.length];
  if(!S.start){
    v.innerHTML='<div class="card"><h2>Apna streak shuru karein</h2><p class="muted">Jis din se aap bure habit se door hain, wahi se ginti shuru hogi. Slip hua to bhi sab kuch delete nahi hota, bas streak naya shuru hota hai.</p>'+
      '<label class="small muted" for="pre">Pehle se kitne din clean hain? (0 = aaj se)</label><input id="pre" type="number" min="0" max="3650" value="0" inputmode="numeric" style="margin:6px 0 12px">'+
      '<button class="btn primary block" id="go">Streak shuru karo</button></div><div class="card"><p>'+q+'</p></div>';
    $("go").onclick=function(){var n=Math.max(0,parseInt($("pre").value,10)||0);S.start=Date.now()-n*DAY;save();render()};
    return;
  }
  var d=Math.floor(cur()/DAY), next=MILE.find(function(m){return m>d})||MILE[MILE.length-1];
  var prev=[0].concat(MILE).filter(function(m){return m<=d}).pop();
  var pct=next===prev?1:Math.min(1,(cur()/DAY-prev)/(next-prev)), C=2*Math.PI*52;
  v.innerHTML='<div class="card"><div class="ringwrap"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--ring)" stroke-width="9"/>'+
    '<circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-pct))+'"/></svg>'+
    '<div class="mid"><div class="days" id="d">'+d+'</div><div class="muted">din clean</div><div class="clock" id="c">'+clock(cur())+'</div></div></div>'+
    '<p class="muted small" style="text-align:center">Agla milestone: '+next+' din</p><div class="chips" style="justify-content:center">'+
    MILE.map(function(m){return '<span class="chip'+(d>=m?' done':'')+'">'+m+'d</span>'}).join("")+'</div></div>'+
    '<button class="btn sos" id="sos">Urge aa raha hai: abhi madad</button><div style="height:14px"></div>'+
    '<div class="card"><p style="margin:0">'+q+'</p></div>'+
    '<div class="card"><h3>Aaj ka check-in</h3><div id="ci"></div></div>'+
    '<div class="card"><h3>Mera kaaran</h3><textarea id="why" placeholder="Main yeh kyun chhod raha hoon? (jab urge aayega tab yahi dikhega)"></textarea></div>'+
    '<div class="stats card"><div class="stat"><b>'+Math.max(d,Math.floor(S.best/DAY))+'</b><span>sabse lamba streak (din)</span></div><div class="stat"><b>'+S.urges+'</b><span>urge jeete</span></div><div class="stat"><b>'+S.relapses.length+'</b><span>slip</span></div></div>'+
    '<button class="btn danger block" id="slip">Slip ho gaya: streak reset</button>';
  $("why").value=S.reasons;$("why").oninput=function(){S.reasons=this.value;save()};
  $("sos").onclick=sos; $("slip").onclick=slip; checkin();
  timers.push(setInterval(function(){var c=$("c");if(c){c.textContent=clock(cur());$("d").textContent=Math.floor(cur()/DAY)}},1000));
}
function checkin(){
  var k=today(),c=S.checkins[k]||{},box=$("ci");
  box.innerHTML='<p class="small muted">Mood</p><div class="seg" id="mood"></div><p class="small muted" style="margin-top:12px">Aaj urge kitna tez tha? <b id="uv">'+(c.urge==null?"-":c.urge)+'</b>/10</p><input type="range" id="urge" min="0" max="10" value="'+(c.urge==null?0:c.urge)+'">';
  var m=$("mood");["1","2","3","4","5"].forEach(function(n){var b=document.createElement("button");b.textContent=n;b.setAttribute("aria-pressed",String(String(c.mood)===n));
    b.onclick=function(){S.checkins[k]=Object.assign(S.checkins[k]||{},{mood:+n});save();checkin()};m.appendChild(b)});
  $("urge").oninput=function(){$("uv").textContent=this.value;S.checkins[k]=Object.assign(S.checkins[k]||{},{urge:+this.value});save()};
}
function slip(){
  modal('<h3>Koi baat nahi, wapas shuru karte hain</h3><p class="muted">Trigger kya tha? Isse aage pattern pehchanna aasan hoga.</p><select id="tr">'+TRIG.map(function(t){return '<option>'+t+'</option>'}).join("")+'</select><div class="row" style="margin-top:14px"><button class="btn danger" id="y">Reset karo</button><button class="btn" id="n">Wapas</button></div>',function(close){
    $("n").onclick=close;
    $("y").onclick=function(){S.best=Math.max(S.best,cur());S.relapses.push({t:Date.now(),trigger:$("tr").value});S.start=Date.now();save();close();render()}});
}

/* ---------- SOS ---------- */
var TASKS=["Phone chhodkar kamre se bahar niklo","20 pushups ya 1 minute plank","Ek glass paani piyo aur muh dho lo","Kisi dost ya ghar wale se baat karo","Chhota walk lo, 10 minute kaafi hain","Padhai ka ek sawaal hal karo"];
function sos(){
  var end=Date.now()+600000, el=document.createElement("div");el.className="overlay";
  el.innerHTML='<div><h2>Ruko. Yeh urge guzar jayega.</h2><p class="muted">Lehar 10 minute me utarti hai. Bas itna samay nikaalo.</p><div class="big" id="sl">10:00</div>'+
    '<div class="breath" id="br">Taiyaar</div><p class="muted small" style="text-align:center" id="bt">4-7-8: saans lo, roko, dheere chhodo</p>'+
    '<div class="card"><h3>Abhi yeh karo</h3>'+TASKS.map(function(t,i){return '<label class="check"><input type="checkbox" id="t'+i+'"><span>'+t+'</span></label>'}).join("")+'</div>'+
    '<div class="card"><h3>Tumne yeh kaaran likha tha</h3><p id="rs" style="margin:0"></p></div>'+
    '<button class="btn primary block" id="won">Urge nikal gaya: maine jeet liya</button><div style="height:10px"></div><button class="btn block" id="cl">Band karo</button></div>';
  document.body.appendChild(el);
  $("rs").textContent=S.reasons||"Abhi koi kaaran nahi likha. Streak page par likh lena.";
  var t0=Date.now(), iv=setInterval(function(){
    $("sl").textContent=mmss(end-Date.now());
    var s=((Date.now()-t0)/1000)%19, b=$("br");
    if(s<4){b.textContent="Saans lo";b.style.transform="scale(1.35)"}else if(s<11){b.textContent="Roko";b.style.transform="scale(1.35)"}else{b.textContent="Chhodo";b.style.transform="scale(1)"}
    if(Date.now()>=end){$("sl").textContent="00:00"}
  },250);
  function done(){clearInterval(iv);el.remove()}
  $("cl").onclick=done; $("won").onclick=function(){S.urges++;var k=today();S.checkins[k]=Object.assign(S.checkins[k]||{},{urge:Math.max(7,(S.checkins[k]||{}).urge||0)});save();done();render()};
}

/* ---------- Focus ---------- */
var run=null, mins=25;
function focus(){
  var v=$("view"),dk=today();
  v.innerHTML='<div class="card"><h2>Padhai focus timer</h2><p class="muted small">Timer chalte waqt padhai karo. Poora hone par minute jud jate hain.</p>'+
    '<div class="seg" id="pre" style="margin-bottom:14px"></div><div class="big" id="ft">'+mmss(run?run.end-Date.now():mins*60000)+'</div>'+
    '<div class="row" style="margin-top:14px;justify-content:center"><button class="btn primary" id="fs">'+(run?"Chalu hai":"Shuru karo")+'</button><button class="btn" id="fx">Roko</button></div></div>'+
    '<div class="card stats"><div class="stat"><b>'+(S.focus[dk]||0)+'</b><span>aaj ke minute</span></div><div class="stat"><b>'+Object.keys(S.focus).reduce(function(a,k){return a+S.focus[k]},0)+'</b><span>kul minute</span></div></div>'+
    '<div class="card"><p class="small muted" style="margin:0">Phone/PC par poora block chahiye to Aur tab me Study Lock ke steps dekho.</p></div>';
  var p=$("pre");[25,45,60].forEach(function(m){var b=document.createElement("button");b.textContent=m+" min";b.setAttribute("aria-pressed",String(m===mins));
    b.onclick=function(){if(run)return;mins=m;focus()};p.appendChild(b)});
  $("fs").onclick=function(){if(run)return;run={end:Date.now()+mins*60000,m:mins};$("fs").textContent="Chalu hai"};
  $("fx").onclick=function(){run=null;focus()};
  timers.push(setInterval(tickFocus,500));
}
function tickFocus(){
  var t=$("ft");if(!t)return;
  if(!run){return}
  var left=run.end-Date.now();
  if(left<=0){var k=today();S.focus[k]=(S.focus[k]||0)+run.m;save();run=null;try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}focus();return}
  t.textContent=mmss(left);
}

/* ---------- Progress ---------- */
function bars(vals,labels,max,warn){
  var W=14*24+20,H=110,out='<svg viewBox="0 0 '+W+' '+H+'" role="img"><line x1="10" x2="'+(W-10)+'" y1="90" y2="90"/>';
  vals.forEach(function(v,i){var h=v==null?0:Math.round(v/max*76),x=14+i*24;
    out+='<rect class="bar'+(warn?' warn':'')+'" x="'+x+'" y="'+(90-h)+'" width="16" height="'+h+'" rx="3"/>';
    if(v!=null&&v>0)out+='<text x="'+(x+8)+'" y="'+(86-h)+'" text-anchor="middle">'+v+'</text>';
    out+='<text x="'+(x+8)+'" y="104" text-anchor="middle">'+labels[i]+'</text>'});
  return out+'</svg>';
}
function progress(){
  var days=[],lab=[],u=[],f=[],i,d,k;
  for(i=13;i>=0;i--){d=new Date(Date.now()-i*DAY);k=today(d);days.push(k);lab.push(d.getDate());u.push((S.checkins[k]||{}).urge==null?null:S.checkins[k].urge);f.push(S.focus[k]||0)}
  var fm=Math.max(60,Math.max.apply(null,f)), cnt={};S.relapses.forEach(function(r){cnt[r.trigger]=(cnt[r.trigger]||0)+1});
  var tr=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]});
  $("view").innerHTML='<div class="card"><h2>Urge ka level (pichhle 14 din)</h2><div class="chart">'+bars(u,lab,10,true)+'</div><p class="small muted" style="margin:6px 0 0">Girta hua graph matlab aadat kamzor ho rahi hai.</p></div>'+
    '<div class="card"><h2>Padhai ke minute</h2><div class="chart">'+bars(f,lab,fm,false)+'</div></div>'+
    '<div class="card"><h2>Slip ke trigger</h2>'+(tr.length?'<ol>'+tr.map(function(t){return '<li>'+t+': '+cnt[t]+'</li>'}).join("")+'</ol>':'<p class="muted" style="margin:0">Abhi koi slip nahi. Bahut badhiya.</p>')+'</div>';
}

/* ---------- More ---------- */
function more(){
  $("view").innerHTML='<div class="card"><h2>Content block karo (free, phone + PC)</h2><p class="muted small">Adult sites ko system level par band karne ka sabse aasan tareeka family DNS hai. Yeh app khud block nahi kar sakta.</p>'+
    DNS.map(function(x){return '<p style="margin:0 0 8px"><b>'+x[0]+'</b><br>Primary <code>'+x[1]+'</code> Secondary <code>'+x[2]+'</code></p>'}).join("")+
    '<h3 style="margin-top:12px">Android</h3><ol class="small"><li>Settings > Network > Private DNS</li><li>Hostname daalo: <code>family.cloudflare-dns.com</code> ya <code>adult-filter-dns.cleanbrowsing.org</code></li></ol>'+
    '<h3>Windows</h3><ol class="small"><li>Settings > Network > apna WiFi > DNS server assignment > Manual</li><li>IPv4 on karo aur upar wale DNS daalo</li><li>Browser me Secure DNS band rakho</li></ol>'+
    '<p class="small"><b>Apna khud ka block list:</b> kaun se app, site ya video (title keyword) band karne hain, yeh Study Lock (PC aur Android) me chunte hain. Sankalp sirf tracker hai, wo apps ya YouTube videos block nahi kar sakta.</p><p class="small muted" style="margin:0">Bacha/khud isse hata na sake, iske liye PC par Standard account aur phone par PIN wala Study Lock use karo.</p></div>'+
    '<div class="card"><h2>Backup / restore</h2><p class="muted small">Data sirf is browser me save hai. Naya phone ya browser ho to yeh text copy karke wahan paste karo.</p><textarea id="bk" aria-label="Backup data"></textarea>'+
    '<div class="row" style="margin-top:10px"><button class="btn" id="cp">Copy</button><button class="btn primary" id="rs">Restore karo</button></div><p class="small" id="bm" role="status"></p></div>'+
    '<div class="card"><h2>Tool ke baare me</h2><p class="muted small" style="margin:0">Sankalp ek free self-help tracker hai. Agar aadat bahut gehri ho ya mann bahut bhaari rahe, to kisi bharosemand bade, counsellor ya doctor se baat karo. Madad maangna kamzori nahi hai.</p></div>';
  $("bk").value=JSON.stringify(S);
  $("cp").onclick=function(){var t=$("bk");t.select();var m=$("bm");
    (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(function(){m.textContent="Copy ho gaya."},function(){m.textContent="Text select ho gaya, ab manually copy karo."})};
  $("rs").onclick=function(){try{var o=JSON.parse($("bk").value);if(typeof o!=="object"||!o)throw 0;S=Object.assign(def(),o);save();$("bm").textContent="Restore ho gaya.";}catch(e){$("bm").textContent="Yeh text sahi backup nahi hai."}};
}


/* ---------- Block (Android bridge) ---------- */
function A(){return window.Android||null}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var COMMON=["com.google.android.youtube","com.instagram.android","com.facebook.katana","com.facebook.lite","com.snapchat.android","com.zhiliaoapp.musically","com.ss.android.ugc.trill","com.netflix.mediaclient","com.twitter.android","com.reddit.frontpage","com.discord","com.roblox.client","com.dts.freefireth","com.dts.freefiremax","com.pubg.imobile","com.activision.callofduty.shooter","com.supercell.clashofclans","com.supercell.clashroyale","com.supercell.brawlstars","com.mojang.minecraftpe","in.startv.hotstar","com.jio.media.ondemand","com.amazon.avod.thirdpartyclient","com.mxtakatak.android","in.mohalla.sharechat","com.pinterest","tv.twitch.android.app"];
function blockView(){
  var v=$("view"),a=A();
  if(!a){v.innerHTML='<div class="card"><h2>App aur content block</h2><p class="muted" style="margin:0">Yeh tab sirf Android app me kaam karta hai. Web page apps ya videos block nahi kar sakta.</p></div>';return}
  var cfg=JSON.parse(a.config());
  if(cfg.endAt>Date.now()){return lockedView(cfg,a)}
  var apps=JSON.parse(a.apps()),mode=cfg.mode,chosen={};cfg.chosen.forEach(function(p){chosen[p]=1});
  var pinNeeded=!cfg.test&&!cfg.hasPin;
  v.innerHTML=
   '<div class="card"><h2>Pehle setup</h2>'+
   '<div class="check"><span style="flex:1">Accessibility: <b>'+(cfg.acc?"ON":"OFF")+'</b>'+(!cfg.acc&&!cfg.auto?'<br><span class="small muted">Android ka rule: ek baar system screen par ON karna padta hai. Button dabane par app wahi screen khol dega, ON karke wapas aa jao.</span>':'')+'</span><button class="btn" id="b1">'+(cfg.acc?"Dekho":"ON karo")+'</button></div>'+
   '<div class="check"><span style="flex:1">Uninstall protection: <b>'+(cfg.admin?"ON":"OFF")+'</b></span><button class="btn" id="b2">'+(cfg.admin?"Dekho":"ON karo")+'</button></div>'+
   (pinNeeded?'<div style="margin-top:12px"><label class="small muted" for="pn">Parent PIN (4+ number)</label><div class="row" style="margin-top:6px"><input id="pn" type="password" inputmode="numeric" style="flex:1"><button class="btn primary" id="pb">Save</button></div></div>':'<p class="small muted" style="margin:10px 0 0">'+(cfg.test?"Test mode: PIN nahi, Unlock button chalega.":"Parent PIN set hai.")+'</p>')+'</div>'+
   '<div class="card"><h2>Kya block karna hai?</h2><div class="seg" id="md" style="margin-bottom:8px"><button data-m="block">Block mode</button><button data-m="allow">Study mode</button></div><p class="small muted" id="mt" style="margin:0"></p></div>'+
   '<div class="card"><h3>Apps chuno</h3><div class="row" style="margin-bottom:8px"><input id="q" placeholder="Search app" style="flex:1"><button class="btn" id="cm">Common distraction</button></div><div id="applist" style="max-height:300px;overflow:auto"></div></div>'+
   '<div class="card"><h3>Content keywords</h3><p class="small muted">Kisi bhi app me yeh shabd screen par dikhe (jaise YouTube video title) to wapas bhej diya jayega. Har line me ek.</p><textarea id="kw" placeholder="prank&#10;mrbeast&#10;reels"></textarea></div>'+
   '<div class="card"><h3>Session</h3><div class="row"><input id="bm" type="number" min="10" max="480" value="60" inputmode="numeric" style="width:110px"><span class="muted small">minute</span></div><p class="small" id="bmsg" role="status" style="color:var(--warn);min-height:1.2em;margin:8px 0"></p><button class="btn primary block" id="bs">BLOCK SESSION SHURU KARO</button></div>';
  $("kw").value=cfg.keywords;
  var al=$("applist");
  apps.forEach(function(x){var l=document.createElement("label");l.className="check";l.dataset.n=x.l.toLowerCase();
    l.innerHTML='<input type="checkbox" value="'+esc(x.p)+'"'+(chosen[x.p]?" checked":"")+'><span>'+esc(x.l)+'</span>';al.appendChild(l)});
  function persist(){var list=[];al.querySelectorAll("input:checked").forEach(function(c){list.push(c.value)});a.save(JSON.stringify({mode:mode,chosen:list,keywords:$("kw").value}))}
  function paintMode(){document.querySelectorAll("#md button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.m===mode))});
    $("mt").textContent=mode==="block"?"Sirf tick kiye hue apps band honge. Baaki sab chalega.":"Sirf tick kiye hue apps chalenge. Baaki sab band."}
  paintMode();
  document.querySelectorAll("#md button").forEach(function(b){b.onclick=function(){mode=b.dataset.m;paintMode();persist()}});
  al.onchange=persist;$("kw").oninput=persist;
  $("q").oninput=function(){var t=this.value.toLowerCase();al.querySelectorAll("label").forEach(function(l){l.hidden=t&&l.dataset.n.indexOf(t)<0})};
  $("cm").onclick=function(){al.querySelectorAll("input").forEach(function(c){if(COMMON.indexOf(c.value)>=0)c.checked=true});persist()};
  $("b1").onclick=function(){a.openAccessibility()};$("b2").onclick=function(){a.openAdmin()};
  if(pinNeeded)$("pb").onclick=function(){var p=$("pn").value;if(p.length<4){$("bmsg").textContent="PIN kam se kam 4 number ka rakho";return}a.setPin(p);blockView()};
  function msg(t){$("bmsg").textContent=t}
  $("bs").onclick=function(){
    var m=parseInt($("bm").value,10)||0;
    if(m<10||m>480)return msg("10 se 480 minute chuno");
    if(!cfg.acc)return msg("Pehle Accessibility ON karo");
    if(pinNeeded)return msg("Pehle Parent PIN set karo");
    persist();
    modal('<h3>'+m+' minute ka lock</h3><p class="muted">Beech me band nahi hoga'+(cfg.test?" (test mode me Unlock button chalega)":", sirf parent PIN se")+'. Shuru karein?</p><div class="row"><button class="btn primary" id="y">Shuru karo</button><button class="btn" id="n">Wapas</button></div>',function(close){
      $("n").onclick=close;$("y").onclick=function(){close();var r=a.start(m);if(r==="ok")blockView();else msg("Shuru nahi hua: "+r)}})};
}
function lockedView(cfg,a){
  var left=cfg.endAt-Date.now();
  $("view").innerHTML='<div class="card" style="text-align:center"><h2>Block chalu hai</h2><div class="big" id="bl">'+mmss(left)+'</div><p class="muted small">'+(cfg.mode==="block"?"Chune hue apps/keywords band hain.":"Sirf chune hue apps chal rahe hain.")+'</p><button class="btn" id="bu">Unlock</button></div>'+
    '<div class="card"><p style="margin:0" class="muted small">Streak, SOS aur Focus abhi bhi chalenge.</p></div>';
  timers.push(setInterval(function(){var c=JSON.parse(a.config()),l=c.endAt-Date.now();if(l<=0){blockView();return}var e=$("bl");if(e)e.textContent=mmss(l)},1000));
  $("bu").onclick=function(){
    if(cfg.test){if(a.stop(""))blockView();return}
    modal('<h3>Parent PIN</h3><input id="up" type="password" inputmode="numeric"><p class="small" id="um" style="color:var(--bad);min-height:1.2em"></p><div class="row"><button class="btn primary" id="uo">Unlock</button><button class="btn" id="uc">Wapas</button></div>',function(close){
      $("uc").onclick=close;$("uo").onclick=function(){if(a.stop($("up").value)){close();blockView()}else $("um").textContent="Galat PIN"}})};
}
window.addEventListener("sk-resume",function(){if(tab==="block")render()});

function modal(html,init){
  var s=document.createElement("div");s.className="scrim";s.innerHTML='<div class="card" role="dialog" aria-modal="true">'+html+'</div>';
  document.body.appendChild(s);init(function(){s.remove()});
}
render();
})();
</script>
